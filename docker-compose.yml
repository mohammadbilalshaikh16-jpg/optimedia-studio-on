version: '3.8'

services:
  optimedia-studio:
    build:
      context: .
      dockerfile: Dockerfile
    image: optimedia-studio:latest
    container_name: optimedia-studio
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
